# Site
title:              "Andrew Long"
bio:                'I am a software developer and chemist'
description:        "I am a software developer and chemist"
locale:             en_US
baseurl: "" # the subpath of your site, e.g. /blog
# The canonical origin. This has to be set: sitemap.xml builds every <loc>
# from it, and jekyll-sitemap builds the Sitemap: line of the generated
# robots.txt from it. Both require absolute URLs, so an empty url silently
# produced a sitemap and a robots.txt that crawlers ignore.
url: "https://www.andrewklong.com" # the base hostname & protocol for your site

defaults:
- scope:
    path: ''
    type: posts
  values:
    permalink: "/blog/:title/"
    layout: post
    author:

# Jekyll
permalink:          /blog/:title/
markdown:           kramdown
port:               4444
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed

# Comments
disqus_shortname:   "andrewklong"

# Social
# Google Analytics 4 measurement ID, rendered by _includes/tracking.html, which
# every layout includes. Replaces UA-49714711-1: Universal Analytics properties
# stopped processing data in July 2023, so the old tag recorded nothing.
analytics-id:       "G-6W9SMS5BQ0"
github:             AndrewKL

# personal
location:           "Seattle, Wa"
# phone:              310-318-5555
# email:              info@default.com

# Plugins. Renamed from `gems` in Jekyll 3.5; the old key warns on every build.
plugins:
  - jekyll-mentions
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

jekyll-mentions:
    base_url: https://github.com

# Exclude list
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site, src, vendor, CNAME, LICENSE, Rakefile, old]
